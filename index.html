
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <h2 class="logo">Compralia</h2>

        <div class="user-menu">
            <div class="avatar" id="user-avatar">U</div>

            <div class="user-info">
                <span class="welcome">Bienvenido</span>
                <h3 id="user-name">Cargando...</h3>
            </div>

            <button id="logout-button">Salir</button>
        </div>
    </header>

    <main class="profile-container">

        <section class="profile-card">

            <div class="profile-avatar" id="profile-avatar">
                U
            </div>

            <h1 id="profile-name">Cargando usuario...</h1>

            <p id="profile-email">Cargando email...</p>

            <span class="role" id="profile-role">Usuario</span>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
